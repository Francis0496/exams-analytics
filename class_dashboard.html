<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class results</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --paper: #e7eef2;
      --ink: #1b2430;
      --muted: #3e4c5c;
      --line: #c5d0d8;
      --pen: #1a4f8b;
      --sheet: #fbfcfd;
      --pass: #1c6b43;
      --fail: #9d1c2a;
      --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: "Segoe UI", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 17px;
      line-height: 1.45;
    }

    button, input { font: inherit; color: inherit; }

    button { cursor: pointer; }

    :focus-visible {
      outline: 3px solid var(--pen);
      outline-offset: 2px;
    }

    .wrap {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-family: var(--serif);
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    h2 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0;
      max-width: 42rem;
      color: var(--muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 18px;
      align-items: flex-end;
      justify-content: flex-end;
    }

    .search {
      width: 220px;
      background: transparent;
      border: 0;
      border-bottom: 2px solid var(--ink);
      padding: 6px 0;
    }

    .status {
      display: flex;
      gap: 14px;
    }

    .status button,
    .clear {
      background: transparent;
      border: 0;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
    }

    .status button[aria-pressed="true"] {
      border-bottom-color: var(--pen);
      color: var(--pen);
    }

    .clear[hidden] { display: none; }

    #summary {
      margin: 8px 0 22px;
      font-family: var(--serif);
      font-size: 1.7rem;
      line-height: 1.25;
      max-width: 40rem;
    }

    .ladder {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      align-items: end;
      min-height: 200px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 36px;
    }

    .grade-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      min-height: 200px;
      background: transparent;
      border: 0;
      padding: 0 0 8px;
    }

    .grade-col .count {
      font-family: var(--serif);
      font-size: 1.55rem;
      line-height: 1;
    }

    .grade-col .bar {
      width: min(64px, 100%);
      min-height: 4px;
    }

    .grade-col .letter {
      font-size: 1rem;
    }

    .grade-col[aria-pressed="true"] .letter {
      color: var(--pen);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .grade-col.is-dim { opacity: 0.38; }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.75fr);
      gap: 36px;
      align-items: start;
      margin-bottom: 40px;
    }

    .mean-row {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) 52px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .mean-track {
      height: 22px;
      background: #d5e0e7;
    }

    .mean-fill {
      display: block;
      height: 100%;
    }

    .mean-value {
      font-family: var(--serif);
      font-size: 1.25rem;
      text-align: right;
    }

    .note {
      margin: 8px 0 28px;
      max-width: 38rem;
      color: var(--muted);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 8px;
    }

    .tabs button {
      background: transparent;
      border: 0;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
    }

    .tabs button[aria-pressed="true"] {
      border-bottom-color: var(--ink);
    }

    .chart {
      width: 100%;
      height: auto;
      display: block;
      overflow: visible;
    }

    .chart text {
      fill: var(--ink);
      font-family: var(--sans);
      font-size: 13px;
    }

    .script {
      background: var(--sheet);
      border-left: 6px solid var(--line);
      min-height: 320px;
      padding: 18px 18px 20px;
    }

    .script h2 { margin-bottom: 4px; }

    .script .prompt {
      margin: 12px 0 0;
      color: var(--muted);
    }

    .script-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .script .who {
      margin: 0;
      font-family: var(--serif);
      font-size: 1.7rem;
      line-height: 1.1;
    }

    .script .id {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .mark {
      font-family: var(--serif);
      font-size: 2.4rem;
      line-height: 1;
    }

    .lines {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    .lines th,
    .lines td {
      text-align: left;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
      font-weight: 400;
    }

    .lines td:last-child,
    .marks td:last-child {
      text-align: right;
      font-family: var(--serif);
      font-size: 1.15rem;
    }

    .script p.remark {
      margin: 14px 0 0;
    }

    .ends {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .end {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      border-top: 1px solid var(--line);
      padding: 10px 0 0;
    }

    .end strong {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 600;
    }

    .block { margin-bottom: 36px; }

    #scatter { background: transparent; }

    .roster-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
    }

    .table-wrap {
      max-height: 520px;
      overflow: auto;
      border-top: 2px solid var(--ink);
    }

    table.roster {
      width: 100%;
      border-collapse: collapse;
    }

    .roster th,
    .roster td {
      text-align: right;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    .roster th:first-child,
    .roster td:first-child { text-align: left; }

    .roster th button {
      background: transparent;
      border: 0;
      padding: 0;
      font-weight: 600;
    }

    .roster tbody tr { cursor: pointer; }

    .roster tbody tr[aria-selected="true"] {
      background: #d9e6f2;
    }

    .roster tbody tr:hover { background: #e4edf3; }

    .roster tbody tr[aria-selected="true"]:hover { background: #d9e6f2; }

    .empty {
      padding: 18px 0;
      color: var(--muted);
    }

    .tip {
      position: fixed;
      z-index: 5;
      pointer-events: none;
      background: var(--ink);
      color: white;
      padding: 6px 8px;
      font-size: 14px;
      max-width: 220px;
      display: none;
    }

    @media (max-width: 800px) {
      header, .stage { display: block; }
      .controls { justify-content: flex-start; margin-top: 16px; }
      h1 { font-size: 2.1rem; }
      #summary { font-size: 1.35rem; }
      .ladder { grid-template-columns: repeat(4, 1fr); border-bottom: 0; gap: 16px 8px; }
      .grade-col { min-height: 140px; }
      .script { margin-top: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Class results</h1>
        <p class="lede">Click a grade, then a student. The board follows what you select.</p>
      </div>
      <div class="controls">
        <input class="search" id="search" type="search" placeholder="Name or ID" aria-label="Find a student by name or ID">
        <div class="status" role="group" aria-label="Exam status">
          <button type="button" data-status="all" aria-pressed="true">All</button>
          <button type="button" data-status="Taken" aria-pressed="false">Sat the exam</button>
          <button type="button" data-status="Absent" aria-pressed="false">Absent</button>
        </div>
        <button type="button" class="clear" id="clear" hidden>Clear filters</button>
      </div>
    </header>

    <p id="summary" aria-live="polite"></p>
    <div class="ladder" id="ladder" role="group" aria-label="Filter by grade"></div>

    <div class="stage">
      <div>
        <section class="block">
          <h2>Test 1, Test 2, and the exam</h2>
          <div id="means"></div>
          <p class="note" id="means-note"></p>
        </section>
        <section class="block">
          <h2>Where each score sits</h2>
          <div class="tabs" role="group" aria-label="Score to show">
            <button type="button" data-spread="Test 1 (100)" aria-pressed="false">Test 1</button>
            <button type="button" data-spread="Test 2 (100)" aria-pressed="false">Test 2</button>
            <button type="button" data-spread="EXAMS" aria-pressed="false">Exam</button>
            <button type="button" data-spread="FINAL_SCORE" aria-pressed="true">Final</button>
          </div>
          <p class="note" id="spread-note"></p>
          <div id="spread"></div>
        </section>
      </div>
      <aside class="script" id="script" aria-live="polite"></aside>
    </div>

    <section class="block">
      <h2>Coursework against the exam</h2>
      <p class="note" id="scatter-note"></p>
      <div id="scatter"></div>
    </section>

    <section>
      <div class="roster-head">
        <h2>Everyone in this view</h2>
        <p class="note" id="list-count"></p>
      </div>
      <div class="table-wrap">
        <table class="roster">
          <thead>
            <tr>
              <th><button type="button" data-sort="Name">Name</button></th>
              <th><button type="button" data-sort="Test 1 (100)">Test 1</button></th>
              <th><button type="button" data-sort="Test 2 (100)">Test 2</button></th>
              <th><button type="button" data-sort="EXAMS">Exam</button></th>
              <th><button type="button" data-sort="FINAL_SCORE">Final</button></th>
              <th><button type="button" data-sort="GRADE">Grade</button></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden>No students match this filter. Clear the filters to see the whole class.</p>
    </section>
  </div>
  <div class="tip" id="tip" role="tooltip"></div>

      "Test 2 (100)": "Test 2",
      EXAMS: "Exam",
      FINAL_SCORE: "Final score"
    };

    const state = {
      grades: new Set(),
      status: "all",
      query: "",
      selected: null,
      spread: "FINAL_SCORE",
      sortKey: "FINAL_SCORE",
      sortDir: -1
    };

    const summaryEl = document.getElementById("summary");
    const ladderEl = document.getElementById("ladder");
    const meansEl = document.getElementById("means");
    const meansNote = document.getElementById("means-note");
    const spreadEl = document.getElementById("spread");
    const spreadNote = document.getElementById("spread-note");
    const scriptEl = document.getElementById("script");
    const scatterEl = document.getElementById("scatter");
    const scatterNote = document.getElementById("scatter-note");
    const rowsEl = document.getElementById("rows");
    const listCount = document.getElementById("list-count");
    const emptyEl = document.getElementById("empty");
    const clearBtn = document.getElementById("clear");
    const tip = document.getElementById("tip");

    function fmt(n) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const r = Math.round(Number(n) * 10) / 10;
      return Number.isInteger(r) ? String(r) : r.toFixed(1);
    }

    function points(n) {
      const text = fmt(Math.abs(n));
      return `${text} ${text === "1" ? "point" : "points"}`;
    }

    function mean(list, key) {
      const vals = list.map((s) => s[key]).filter((v) => v != null && v !== "");
      if (!vals.length) return null;
      return vals.reduce((a, b) => a + Number(b), 0) / vals.length;
    }

    function passes(s) {
      if (state.status !== "all" && s["Exam status"] !== state.status) return false;
      if (state.grades.size && !state.grades.has(s.GRADE)) return false;
      const q = state.query.trim().toLowerCase();
      if (!q) return true;
      return s.Name.toLowerCase().includes(q) || String(s["ID Number"]).includes(q);
    }

    function view() {
      return STUDENTS.filter(passes);
    }

    function scoreOf(s, key) {
      if (key === "EXAMS" && s["Exam status"] !== "Taken") return null;
      if (key === "FINAL_SCORE" && s.FINAL_SCORE == null) return null;
      return s[key];
    }

    function sortValue(s, key) {
      if (key === "Name") return s.Name.toLowerCase();
      if (key === "GRADE") {
        const i = GRADE_ORDER.indexOf(s.GRADE);
        return i === -1 ? null : i;
      }
      return scoreOf(s, key);
    }

    function sorted(list) {
      const dir = state.sortDir;
      return list.slice().sort((a, b) => {
        const av = sortValue(a, state.sortKey);
        const bv = sortValue(b, state.sortKey);
        if (av == null && bv == null) return a.No - b.No;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        return a.No - b.No;
      });
    }

    function filtersOn() {
      return state.grades.size > 0 || state.status !== "all" || state.query.trim() !== "";
    }

    function quantile(sortedVals, p) {
      const idx = (sortedVals.length - 1) * p;
      const lo = Math.floor(idx);
      const hi = Math.ceil(idx);
      if (lo === hi) return sortedVals[lo];
      return sortedVals[lo] * (hi - idx) + sortedVals[hi] * (idx - lo);
    }

    function renderSummary(list) {
      const passed = list.filter((s) => PASS.has(s.GRADE)).length;
      const failed = list.filter((s) => s.GRADE === "F").length;
      const absent = list.filter((s) => s["Exam status"] === "Absent").length;
      const finals = list.filter((s) => s.FINAL_SCORE != null);
      const avg = mean(finals, "FINAL_SCORE");
      const whole = !filtersOn();
      if (!list.length) {
        summaryEl.textContent = "Nothing matches the current filter.";
        return;
      }
      const tail = avg == null ? "" : ` The mean final score is ${fmt(avg)}.`;
      if (absent === list.length) {
        summaryEl.textContent = list.length === 1
          ? `${list[0].Name} was absent from the exam and has no final grade.`
          : `${list.length} students in this view. All were absent and have no final grade.`;
        return;
      }
      if (whole) {
        summaryEl.textContent = `${passed} passed, ${failed} failed, and ${absent} were absent.${tail}`;
        return;
      }
      const who = list.length === 1 ? "1 student in this view." : `${list.length} students in this view.`;
      const bits = [];
      if (passed) bits.push(`${passed} passed`);
      if (failed) bits.push(`${failed} failed`);
      summaryEl.textContent = `${who} ${bits.join(" and ")}.${tail}`;
    }

    function renderLadder(list) {
      const active = state.grades.size > 0;
      const counts = Object.fromEntries(GRADE_ORDER.map((g) => [g, 0]));
      STUDENTS.forEach((s) => {
        if (state.status !== "all" && s["Exam status"] !== state.status) return;
        const q = state.query.trim().toLowerCase();
        if (q && !(s.Name.toLowerCase().includes(q) || String(s["ID Number"]).includes(q))) return;
        if (counts[s.GRADE] != null) counts[s.GRADE] += 1;
      });
      const max = Math.max(1, ...GRADE_ORDER.map((g) => counts[g]));
      ladderEl.replaceChildren();
      GRADE_ORDER.forEach((g) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "grade-col";
        btn.dataset.grade = g;
        btn.setAttribute("aria-pressed", state.grades.has(g) ? "true" : "false");
        if (active && !state.grades.has(g)) btn.classList.add("is-dim");
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = String(counts[g]);
        const bar = document.createElement("span");
        bar.className = "bar";
        bar.style.height = `${Math.max(4, Math.round((counts[g] / max) * 130))}px`;
        bar.style.background = GRADE_COLOR[g];
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.textContent = g;
        btn.append(count, bar, letter);
        btn.setAttribute("aria-label", `${g}, ${counts[g]} students`);
        ladderEl.append(btn);
      });
    }

    function renderMeans(list) {
      const sat = list.filter((s) => s["Exam status"] === "Taken");
      const rows = [
        ["Test 1", mean(list, "Test 1 (100)"), "#1d4e89"],
        ["Test 2", mean(list, "Test 2 (100)"), "#1c6b43"],
        ["Exam", mean(sat, "EXAMS"), "#9d1c2a"]
      ];
      meansEl.replaceChildren();
      rows.forEach(([label, value, color]) => {
        const row = document.createElement("div");
        row.className = "mean-row";
        const name = document.createElement("span");
        name.textContent = label;
        const track = document.createElement("span");
        track.className = "mean-track";
        const fill = document.createElement("span");
        fill.className = "mean-fill";
        fill.style.background = color;
        fill.style.width = value == null ? "0%" : `${Math.max(0, Math.min(100, value))}%`;
        track.append(fill);
        const num = document.createElement("span");
        num.className = "mean-value";
        num.textContent = fmt(value);
        row.append(name, track, num);
        meansEl.append(row);
      });
      const t1 = mean(list, "Test 1 (100)");
      const t2 = mean(list, "Test 2 (100)");
      const exam = mean(sat, "EXAMS");
      const up = list.filter((s) => s["Test 2 minus Test 1"] > 0).length;
      if (t2 == null) {
        meansNote.textContent = "";
        return;
      }
      const change = `${up} of ${list.length} scored higher on Test 2 than on Test 1.`;
      if (exam == null) {
        meansNote.textContent = `Test 1 averages ${fmt(t1)} and Test 2 averages ${fmt(t2)}. Nobody in this view sat the exam. ${change}`;
        return;
      }
      const gap = t2 - exam;
      const direction = gap >= 0
        ? `The exam averages ${fmt(exam)}, which is ${points(gap)} lower than Test 2.`
        : `The exam averages ${fmt(exam)}, which is ${points(gap)} higher than Test 2.`;
      meansNote.textContent = `${direction} ${change}`;
    }

    function renderSpread(list) {
      const key = state.spread;
      document.querySelectorAll("[data-spread]").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.spread === key ? "true" : "false");
      });
      const plotted = list.filter((s) => scoreOf(s, key) != null);
      const skipped = list.length - plotted.length;
      const label = SPREAD_LABEL[key];
      spreadNote.textContent = skipped
        ? `${label} for ${plotted.length} students. ${skipped} ${skipped === 1 ? "has" : "have"} no ${label.toLowerCase()} in this view.`
        : `${label} for ${plotted.length} students. Each dot is one student.`;

      spreadEl.replaceChildren();
      if (!plotted.length) return;

      const vals = plotted.map((s) => Number(scoreOf(s, key))).sort((a, b) => a - b);
      const q1 = quantile(vals, 0.25);
      const med = quantile(vals, 0.5);
      const q3 = quantile(vals, 0.75);
      const iqr = q3 - q1;
      const lowFence = q1 - 1.5 * iqr;
      const highFence = q3 + 1.5 * iqr;
      const whiskLo = vals.find((v) => v >= lowFence);
      const whiskHi = [...vals].reverse().find((v) => v <= highFence);

      const w = 640;
      const h = 280;
      const padL = 36;
      const padR = 16;
      const padT = 16;
      const padB = 28;
      const yOf = (v) => padT + (100 - v) / 100 * (h - padT - padB);
      const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": `${label} box plot with one dot per student` });
      [0, 25, 50, 75, 100].forEach((tick) => {
        const y = yOf(tick);
        svg.append(svgEl("line", { x1: padL, x2: w - padR, y1: y, y2: y, stroke: "#d5dee4", "stroke-width": "1" }));
        const t = svgEl("text", { x: 0, y: y + 4 });
        t.textContent = String(tick);
        svg.append(t);
      });

      const cx = 150;
      svg.append(svgEl("line", { x1: cx, x2: cx, y1: yOf(whiskLo), y2: yOf(whiskHi), stroke: "#1b2430", "stroke-width": "2" }));
      [whiskLo, whiskHi].forEach((v) => {
        svg.append(svgEl("line", { x1: cx - 18, x2: cx + 18, y1: yOf(v), y2: yOf(v), stroke: "#1b2430", "stroke-width": "2" }));
      });
      const box = svgEl("rect", {
        x: cx - 28,
        y: yOf(q3),
        width: 56,
        height: Math.max(1, yOf(q1) - yOf(q3)),
        fill: "#d9e6f2",
        stroke: "#1b2430",
        "stroke-width": "2"
      });
      svg.append(box);
      svg.append(svgEl("line", { x1: cx - 28, x2: cx + 28, y1: yOf(med), y2: yOf(med), stroke: "#1a4f8b", "stroke-width": "3" }));

      const spots = [];
      plotted
        .slice()
        .sort((a, b) => Number(scoreOf(a, key)) - Number(scoreOf(b, key)) || a.No - b.No)
        .forEach((s) => {
          const v = Number(scoreOf(s, key));
          const y = yOf(v);
          let x = 250;
          let step = 0;
          while (spots.some((p) => Math.abs(p.y - y) < 12 && Math.abs(p.x - x) < 12) && step < 80) {
            step += 1;
            const side = step % 2 === 0 ? 1 : -1;
            x = 250 + side * Math.ceil(step / 2) * 13;
          }
          x = Math.max(210, Math.min(w - 18, x));
          spots.push({ s, x, y, v });
        });
      spots.forEach(({ s, x, y, v }) => {
        const outlier = v < lowFence || v > highFence;
        const c = svgEl("circle", {
          cx: x,
          cy: y,
          r: state.selected === s.No ? 7 : 5,
          fill: GRADE_COLOR[s.GRADE] || "#5c6b7a",
          stroke: state.selected === s.No ? "#1b2430" : "white",
          "stroke-width": state.selected === s.No ? "2" : "1",
          tabindex: "0",
          role: "button"
        });
        c.dataset.no = String(s.No);
        c.dataset.tip = `${s.Name} · ${label} ${fmt(v)}${s.GRADE ? " · " + s.GRADE : ""}${outlier ? " · outlier" : ""}`;
        c.setAttribute("aria-label", c.dataset.tip);
        svg.append(c);
      });
      spreadEl.append(svg);
    }

    function renderScript() {
      const s = STUDENTS.find((row) => row.No === state.selected);
      scriptEl.replaceChildren();
      scriptEl.style.borderLeftColor = s && s.GRADE ? GRADE_COLOR[s.GRADE] : "#c5d0d8";
      const heading = document.createElement("h2");
      heading.textContent = "One student";
      scriptEl.append(heading);
      if (!s) {
        const ranked = view().filter((row) => row.FINAL_SCORE != null);
        const p = document.createElement("p");
        p.className = "prompt";
        p.textContent = "Click a dot or a name. That student's marks open on this sheet.";
        scriptEl.append(p);
        if (ranked.length) {
          const high = ranked.reduce((a, b) => (a.FINAL_SCORE >= b.FINAL_SCORE ? a : b));
          const low = ranked.reduce((a, b) => (a.FINAL_SCORE <= b.FINAL_SCORE ? a : b));
          const list = document.createElement("div");
          list.className = "ends";
          [["Highest", high], ["Lowest", low]].forEach(([caption, row]) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "end";
            btn.dataset.no = String(row.No);
            const cap = document.createElement("span");
            cap.textContent = caption;
            const nm = document.createElement("strong");
            nm.textContent = row.Name;
            const sc = document.createElement("span");
            sc.textContent = `${fmt(row.FINAL_SCORE)} · ${row.GRADE}`;
            btn.append(cap, nm, sc);
            list.append(btn);
          });
          scriptEl.append(list);
        }
        return;
      }
      const top = document.createElement("div");
      top.className = "script-top";
      const whoWrap = document.createElement("div");
      const who = document.createElement("p");
      who.className = "who";
      who.textContent = s.Name;
      const id = document.createElement("p");
      id.className = "id";
      id.textContent = `ID ${s["ID Number"]}`;
      whoWrap.append(who, id);
      const mark = document.createElement("div");
      mark.className = "mark";
      mark.style.color = s.GRADE ? GRADE_COLOR[s.GRADE] : "#3e4c5c";
      mark.textContent = s.GRADE || "Absent";
      top.append(whoWrap, mark);
      const table = document.createElement("table");
      table.className = "lines";
      const body = document.createElement("tbody");
      const examText = s["Exam status"] === "Taken" ? fmt(s.EXAMS) : "Absent";
      [
        ["Test 1", fmt(s["Test 1 (100)"])],
        ["Test 2", fmt(s["Test 2 (100)"])],
        ["Coursework average", fmt(s.AVERAGE)],
        ["Exam", examText],
        ["Final", fmt(s.FINAL_SCORE)]
      ].forEach(([k, v]) => {
        const tr = document.createElement("tr");
        const th = document.createElement("th");
        th.scope = "row";
        th.textContent = k;
        const td = document.createElement("td");
        td.textContent = v;
        tr.append(th, td);
        body.append(tr);
      });
      table.append(body);
      const remark = document.createElement("p");
      remark.className = "remark";
      remark.textContent = remarkFor(s);
      scriptEl.append(top, table, remark);
    }

    function remarkFor(s) {
      const delta = s["Test 2 minus Test 1"];
      const testLine = delta === 0
        ? "Test 2 matched Test 1."
        : delta > 0
          ? `Test 2 was ${points(delta)} above Test 1.`
          : `Test 2 was ${points(delta)} below Test 1.`;
      if (s["Exam status"] !== "Taken") return `${testLine} They did not sit the exam, so there is no final grade.`;
      const gap = s["Test average minus exam"];
      const examLine = gap > 0
        ? `The exam was ${points(gap)} below the coursework average.`
        : gap < 0
          ? `The exam was ${points(gap)} above the coursework average.`
          : "The exam matched the coursework average.";
      return `${testLine} ${examLine}`;
    }

    function renderScatter(list) {
      const sat = list.filter((s) => s["Exam status"] === "Taken" && s.EXAMS != null && s.AVERAGE != null);
      const absent = list.filter((s) => s["Exam status"] === "Absent").length;
      scatterNote.textContent = absent
        ? `${sat.length} students who sat the exam. ${absent} absent ${absent === 1 ? "student is" : "students are"} left off this chart. The line is where coursework and the exam match.`
        : "Each dot is a student who sat the exam. The line is where coursework and the exam match.";
      scatterEl.replaceChildren();
      if (!sat.length) return;
      const w = 640;
      const h = 420;
      const pad = { l: 46, r: 16, t: 12, b: 36 };
      const xOf = (v) => pad.l + v / 100 * (w - pad.l - pad.r);
      const yOf = (v) => pad.t + (100 - v) / 100 * (h - pad.t - pad.b);
      const svg = svgEl("svg", { class: "chart", viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": "Coursework average against exam score" });
      [0, 25, 50, 75, 100].forEach((tick) => {
        svg.append(svgEl("line", { x1: xOf(tick), x2: xOf(tick), y1: pad.t, y2: h - pad.b, stroke: "#d5dee4" }));
        svg.append(svgEl("line", { x1: pad.l, x2: w - pad.r, y1: yOf(tick), y2: yOf(tick), stroke: "#d5dee4" }));
        const tx = svgEl("text", { x: xOf(tick) - 8, y: h - 14 });
        tx.textContent = String(tick);
        const ty = svgEl("text", { x: 4, y: yOf(tick) + 4 });
        ty.textContent = String(tick);
        svg.append(tx, ty);
      });
      svg.append(svgEl("line", {
        x1: xOf(0), y1: yOf(0), x2: xOf(100), y2: yOf(100),
        stroke: "#9d1c2a", "stroke-dasharray": "5 4", "stroke-width": "1.5"
      }));
      sat.forEach((s) => {
        const c = svgEl("circle", {
          cx: xOf(Number(s.AVERAGE)),
          cy: yOf(Number(s.EXAMS)),
          r: state.selected === s.No ? 7 : 5.5,
          fill: GRADE_COLOR[s.GRADE] || "#5c6b7a",
          stroke: state.selected === s.No ? "#1b2430" : "white",
          "stroke-width": state.selected === s.No ? "2" : "1",
          tabindex: "0",
          role: "button"
        });
        c.dataset.no = String(s.No);
        c.dataset.tip = `${s.Name} · coursework ${fmt(s.AVERAGE)} · exam ${fmt(s.EXAMS)} · ${s.GRADE}`;
        c.setAttribute("aria-label", c.dataset.tip);
        svg.append(c);
      });
      const xlab = svgEl("text", { x: w / 2 - 70, y: h - 2 });
      xlab.textContent = "Coursework average";
      svg.append(xlab);
      scatterEl.append(svg);
    }

    function renderTable(list) {
      const data = sorted(list);
      listCount.textContent = `${data.length} ${data.length === 1 ? "student" : "students"}`;
      emptyEl.hidden = data.length > 0;
      rowsEl.replaceChildren();
      document.querySelectorAll("[data-sort]").forEach((btn) => {
        const on = btn.dataset.sort === state.sortKey;
        btn.setAttribute("aria-sort", on ? (state.sortDir < 0 ? "descending" : "ascending") : "none");
        const base = btn.dataset.label || btn.textContent.replace(/ [↑↓]$/, "");
        btn.dataset.label = base;
        btn.textContent = on ? `${base} ${state.sortDir < 0 ? "↓" : "↑"}` : base;
      });
      data.forEach((s) => {
        const tr = document.createElement("tr");
        tr.tabIndex = 0;
        tr.dataset.no = String(s.No);
        tr.setAttribute("aria-selected", state.selected === s.No ? "true" : "false");
        const cells = [
          s.Name,
          fmt(s["Test 1 (100)"]),
          fmt(s["Test 2 (100)"]),
          s["Exam status"] === "Taken" ? fmt(s.EXAMS) : "Absent",
          fmt(s.FINAL_SCORE),
          s.GRADE || "—"
        ];
        cells.forEach((text) => {
          const td = document.createElement("td");
          td.textContent = text;
          tr.append(td);
        });
        rowsEl.append(tr);
      });
    }

    function svgEl(name, attrs) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name);
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === "class") node.setAttribute("class", v);
        else node.setAttribute(k, v);
      });
      return node;
    }

    function select(no) {
      state.selected = no;
      render();
    }

    function render() {
      const list = view();
      if (state.selected != null && !list.some((s) => s.No === state.selected)) state.selected = null;
      clearBtn.hidden = !filtersOn();
      renderSummary(list);
      renderLadder(list);
      renderMeans(list);
      renderSpread(list);
      renderScript();
      renderScatter(list);
      renderTable(list);
    }

    ladderEl.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-grade]");
      if (!btn) return;
      const g = btn.dataset.grade;
      if (state.grades.has(g)) state.grades.delete(g);
      else state.grades.add(g);
      render();
    });

    document.querySelector(".status").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-status]");
      if (!btn) return;
      state.status = btn.dataset.status;
      document.querySelectorAll("[data-status]").forEach((el) => {
        el.setAttribute("aria-pressed", el === btn ? "true" : "false");
      });
      render();
    });

    document.querySelector(".tabs").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-spread]");
      if (!btn) return;
      state.spread = btn.dataset.spread;
      render();
    });

    document.getElementById("search").addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    clearBtn.addEventListener("click", () => {
      state.grades.clear();
      state.status = "all";
      state.query = "";
      document.getElementById("search").value = "";
      document.querySelectorAll("[data-status]").forEach((el) => {
        el.setAttribute("aria-pressed", el.dataset.status === "all" ? "true" : "false");
      });
      render();
    });

    document.querySelector(".roster thead").addEventListener("click", (event) => {
      const btn = event.target.closest("[data-sort]");
      if (!btn) return;
      const key = btn.dataset.sort;
      if (state.sortKey === key) state.sortDir *= -1;
      else {
        state.sortKey = key;
        state.sortDir = key === "Name" || key === "GRADE" ? 1 : -1;
      }
      render();
    });

    function pickFromEvent(event) {
      const node = event.target.closest("[data-no]");
      if (!node) return;
      select(Number(node.dataset.no));
    }

    spreadEl.addEventListener("click", pickFromEvent);
    scatterEl.addEventListener("click", pickFromEvent);
    rowsEl.addEventListener("click", pickFromEvent);
    scriptEl.addEventListener("click", pickFromEvent);
    spreadEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        pickFromEvent(event);
      }
    });
    scatterEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        pickFromEvent(event);
      }
    });
    rowsEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        pickFromEvent(event);
      }
    });

    function showTip(event) {
      const node = event.target.closest("[data-tip]");
      if (!node) {
        tip.style.display = "none";
        return;
      }
      tip.textContent = node.dataset.tip;
      tip.style.display = "block";
      tip.style.left = `${event.clientX + 12}px`;
      tip.style.top = `${event.clientY + 12}px`;
    }

    spreadEl.addEventListener("pointermove", showTip);
    scatterEl.addEventListener("pointermove", showTip);
    spreadEl.addEventListener("pointerleave", () => { tip.style.display = "none"; });
    scatterEl.addEventListener("pointerleave", () => { tip.style.display = "none"; });

    render();
  </script>
</body>
</html>
